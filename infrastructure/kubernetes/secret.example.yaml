# Template Secret manifest for local development or bootstrapping
# In production, use External Secrets Operator (see external-secret.yaml) or Sealed Secrets.
# NEVER commit production plaintext secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: intelligent-payment
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_GENERATED_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_MIN_32_CHAR_RANDOM_HEX_SECRET"
  STRIPE_SECRET_KEY: "REPLACE_WITH_STRIPE_SECRET_KEY"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"
  AZURE_STORAGE_CONNECTION_STRING: "REPLACE_WITH_AZURE_STORAGE_CONNECTION_STRING"
