apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  namespace: intelligent-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: intelligentpayment/user-service:1.0.0
          env:
            - name: SERVICE_NAME
              value: "user-service"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:change_in_production_super_secret_db_password@postgres-service:5432/user_service_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: intelligent-payment
spec:
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8001
