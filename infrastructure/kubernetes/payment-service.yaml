apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  namespace: intelligent-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: intelligentpayment/payment-service:1.0.0
          env:
            - name: SERVICE_NAME
              value: "payment-service"
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:change_in_production_super_secret_db_password@postgres-service:5432/payment_service_db"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: REDIS_URL
            - name: FRAUD_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: FRAUD_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: ORDER_SERVICE_URL
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: USE_MOCK_PAYMENT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: USE_MOCK_PAYMENT_PROVIDER
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 8005
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: intelligent-payment
spec:
  selector:
    app: payment-service
  ports:
    - port: 8005
      targetPort: 8005
