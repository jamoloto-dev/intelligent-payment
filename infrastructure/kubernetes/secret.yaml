# Staging/Dev placeholder Secret.
# In production, manage secrets using External Secrets Operator (external-secret.yaml) or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: intelligent-payment
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "placeholder_db_password_override_via_secret_store"
  JWT_SECRET: "placeholder_jwt_secret_min_32_characters_long_override_me"
  STRIPE_SECRET_KEY: "sk_test_placeholder_key"
  STRIPE_WEBHOOK_SECRET: "whsec_placeholder_secret"
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=placeholder;AccountKey=placeholder;EndpointSuffix=core.windows.net"
