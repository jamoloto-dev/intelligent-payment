# Production External Secrets Operator (ESO) integration with Azure Key Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault-store
  namespace: intelligent-payment
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultUrl: "https://kv-payment-prod.vault.azure.net"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-external-secrets
  namespace: intelligent-payment
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: platform-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: stripe-secret-key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: stripe-webhook-secret
    - secretKey: AZURE_STORAGE_CONNECTION_STRING
      remoteRef:
        key: azure-storage-connection-string
