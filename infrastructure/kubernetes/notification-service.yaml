apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  namespace: intelligent-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: intelligentpayment/notification-service:1.0.0
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 8006
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: intelligent-payment
spec:
  selector:
    app: notification-service
  ports:
    - port: 8006
      targetPort: 8006
