name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  code-quality-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Black Code Formatter Check
        run: |
          black --check .

      - name: Execute Automated Test Suite with Coverage
        run: |
          pytest --cov=shared --cov=services --cov=functions --cov-report=xml --cov-report=term tests/
        env:
          JWT_SECRET: super_secret_jwt_key_for_development_purposes_min32chars
          JWT_ALGORITHM: HS256
          USE_MOCK_PAYMENT_PROVIDER: "true"

  docker-build:
    name: Build & Validate Docker Containers
    needs: code-quality-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - fraud-service
          - notification-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: intelligentpayment/${{ matrix.service }}:${{ github.sha }}

  security-scan:
    name: Dependency & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
